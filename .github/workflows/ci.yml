name: ci-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Static acceptance checks
        shell: pwsh
        run: ./scripts/check-static.ps1

      - name: Secret scan (gitleaks)
        shell: pwsh
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e
        run: |
          $archive = Join-Path $env:RUNNER_TEMP gitleaks.zip
          Invoke-WebRequest -Uri "https://github.com/gitleaks/gitleaks/releases/download/v$env:GITLEAKS_VERSION/gitleaks_$env:GITLEAKS_VERSION`_windows_x64.zip" -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:GITLEAKS_SHA256.ToLowerInvariant()) { throw "gitleaks checksum mismatch: $actual" }
          $dest = Join-Path $env:RUNNER_TEMP gitleaks-bin
          Expand-Archive $archive -DestinationPath $dest -Force
          $bin = Join-Path $dest gitleaks.exe
          & $bin git --no-banner --redact=100 --exit-code=2 --report-format=json --report-path (Join-Path $env:RUNNER_TEMP gitleaks-report.json)

      - name: actionlint
        shell: pwsh
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9
        run: |
          $archive = Join-Path $env:RUNNER_TEMP actionlint.zip
          Invoke-WebRequest -Uri "https://github.com/rhysd/actionlint/releases/download/v$env:ACTIONLINT_VERSION/actionlint_$env:ACTIONLINT_VERSION`_windows_amd64.zip" -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:ACTIONLINT_SHA256) { throw "actionlint checksum mismatch: $actual" }
          $dest = Join-Path $env:RUNNER_TEMP actionlint-bin
          Expand-Archive $archive -DestinationPath $dest -Force
          & (Join-Path $dest actionlint.exe)

      - name: zizmor
        shell: pwsh
        env:
          ZIZMOR_VERSION: 1.32.0
          ZIZMOR_SHA256: d284a16e09d9df4ce2c000357e7b59bd531be093bea5718a1ce225b449b59d49
        run: |
          $archive = Join-Path $env:RUNNER_TEMP zizmor.zip
          Invoke-WebRequest -Uri "https://github.com/zizmorcore/zizmor/releases/download/v$env:ZIZMOR_VERSION/zizmor-x86_64-pc-windows-msvc.zip" -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:ZIZMOR_SHA256) { throw "zizmor checksum mismatch: $actual" }
          $dest = Join-Path $env:RUNNER_TEMP zizmor-bin
          Expand-Archive $archive -DestinationPath $dest -Force
          & (Join-Path $dest zizmor.exe) --min-severity medium .

      - name: Build Release x64
        shell: pwsh
        run: msbuild WirelessDeviceBattery.vcxproj /p:Configuration=Release /p:Platform=x64 /p:TreatWarningsAsErrors=true

      - name: Verify artifact
        shell: pwsh
        run: |
          if (-not (Test-Path bin/x64/Release/WirelessDeviceBattery.dll)) { throw 'DLL missing' }
          Get-FileHash bin/x64/Release/WirelessDeviceBattery.dll -Algorithm SHA256 | Format-List
